name: Build micfix DiPlay APK

# 在 GitHub 网页上手动触发：Actions → 左侧本工作流 → Run workflow。
# 产物：Actions 运行页底部的 Artifacts → diplay-micfix-debug-apk。
on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "提供 MFi 配件身份的上游 release tag"
        required: true
        default: "v0.2.64"
      java_version:
        description: "构建用 JDK；docs/BUILD.md 要求 25，若镜像缺 25 可改 21"
        required: true
        default: "25"

permissions:
  contents: read

jobs:
  build:
    name: assembleStandaloneDebug
    # 固定 runner 版本。ubuntu-latest 会在 2026-10-19 迁移到 Ubuntu 26，
    # 固定成 24.04 可避免那天之后构建环境突然变化。
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Android SDK + NDK 占用很大，先腾出空间，避免构建中途磁盘写满。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ github.event.inputs.java_version }}

      # runner 镜像本来就预装了 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk），
      # 所以这里不使用 android-actions/setup-android —— 它的 v3 声明 using: node20，
      # 被 GitHub 强制跑在 node24 上会直接失败；与其等它升级，不如直接用预装 SDK。
      - name: Configure Android SDK
        run: |
          set -uo pipefail
          echo "=== 环境探查 ==="
          echo "runner      : ${ImageOS:-unknown} ${ImageVersion:-}"
          echo "ANDROID_HOME: ${ANDROID_HOME:-<未设置>}"
          echo "SDK_ROOT    : ${ANDROID_SDK_ROOT:-<未设置>}"
          ls -ld /usr/local/lib/android/sdk 2>/dev/null || echo "  /usr/local/lib/android/sdk 不存在"

          SDK=""
          for c in "$ANDROID_SDK_ROOT" "$ANDROID_HOME" /usr/local/lib/android/sdk "$HOME/android-sdk"; do
            if [ -n "$c" ] && [ -d "$c" ]; then SDK="$c"; echo "  命中：$c"; break; fi
          done
          if [ -z "$SDK" ]; then
            echo "::error::找不到 Android SDK。上面列出的候选路径都不存在。"
            find / -maxdepth 4 -type d -name "android-sdk*" 2>/dev/null | head -10
            exit 1
          fi

          echo "使用 SDK：$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SM="$(find "$SDK" -maxdepth 4 -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "$SM" ]; then
            echo "::error::SDK 里找不到 sdkmanager。目录结构如下（前两层）："
            find "$SDK" -maxdepth 2 -type d | head -24
            exit 1
          fi
          echo "$(dirname "$SM")" >> "$GITHUB_PATH"
          echo "sdkmanager：$SM"
          [ -d "$SDK/platform-tools" ] && echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "SDK 根目录内容："
          ls "$SDK"

      # 镜像里已有 build-tools 36.0.0 与 platform-tools；这里补 platform 37 和 NDK 25。
      # NDK 版本必须与 shared/build.gradle 的 ndkVersion = '25.2.9519653' 一致，
      # 镜像预装的是 27/29/30，不能用。
      - name: Install SDK packages
        run: |
          set -euo pipefail
          if ! command -v sdkmanager >/dev/null; then
            echo "::error::sdkmanager 不在 PATH 上"
            exit 1
          fi
          echo "sdkmanager: $(command -v sdkmanager)"
          echo "sdkmanager 版本："
          sdkmanager --version || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;25.2.9519653"
          echo "--- 已安装的 NDK ---"
          ls "$ANDROID_HOME/ndk/"

      - name: Show toolchain
        run: |
          java -version
          python3 --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "runner=${ImageOS:-unknown}"

      # 关键一步：只改 AndroidMediaSink.kt，源码其余部分保持上游原样。
      - name: Apply audio-mode debounce patch
        run: python3 patches/apply_audio_mode_debounce.py

      # 上游 shared/build.gradle 把 prepareOpusSources / prepareLwipSources 挂在
      # 'generateJsonModel*' 和 'externalNativeBuild*' 前缀上，但 AGP 9.3 实际执行的是
      # ':shared:configureNdkBuildDebug[abi]' —— 两个前缀都不匹配，所以这两个准备任务
      # 从未被触发。而 shared/src/main/jni/Android.mk 会硬校验源码是否就位，
      # 缺任何一个都会让 configure 阶段直接失败。这里手动准备，绕开上游的挂接缺陷。
      - name: Fetch pinned native sources (libopus + lwIP)
        run: |
          set -euo pipefail
          python3 scripts/prepare-libopus.py
          python3 scripts/prepare-lwip.py
          echo "--- 确认源码就位 ---"
          test -f shared/src/main/jni/libopus/opus_sources.mk || { echo "::error::libopus 源码缺失"; exit 1; }
          test -f shared/src/main/jni/lwip/src/include/lwip/opt.h || { echo "::error::lwip 源码缺失"; exit 1; }
          echo "libopus 与 lwIP 源码均已就位"

      # CarPlay 需要 Apple MFi 配件身份。官方 APK 里带着一份，直接复用，
      # 免去把私钥上传到仓库。auth-assets 由 mobile/build.gradle.kts 自动识别。
      - name: Extract accessory identity from the official APK
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.upstream_tag }}"
          BASE="https://github.com/programmerguohuajing/DiPlay-Legacy-Android/releases/download/${TAG}"
          curl -fL --retry 3 --retry-delay 2 -o /tmp/official.apk "${BASE}/DiPlay-${TAG}-legacy-release.apk"
          ls -l /tmp/official.apk
          mkdir -p auth-assets/offline-mfi
          unzip -p /tmp/official.apk assets/offline-mfi/identity.pk8 > auth-assets/offline-mfi/identity.pk8
          unzip -p /tmp/official.apk assets/offline-mfi/certificate.p7b > auth-assets/offline-mfi/certificate.p7b
          ls -l auth-assets/offline-mfi/
          test -s auth-assets/offline-mfi/identity.pk8
          test -s auth-assets/offline-mfi/certificate.p7b

      - name: Verify accessory identity
        env:
          DIPLAY_AUTH_ASSETS_DIR: ${{ github.workspace }}/auth-assets
        run: |
          set -euo pipefail
          # 单独跑一次认证校验：这一步失败说明 MFi 材料或 shared 编译有问题，
          # 与后面的打包失败区分开，便于定位。
          chmod +x ./gradlew
          ./gradlew :mobile:verifyStandaloneAuthentication --no-daemon --console=plain

      - name: Build standalone debug APK
        env:
          DIPLAY_AUTH_ASSETS_DIR: ${{ github.workspace }}/auth-assets
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew :mobile:assembleStandaloneDebug --no-daemon --stacktrace \
            --console=plain > /tmp/build.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::Gradle 退出码 $code"
            echo "########## What went wrong（根因）##########"
            sed -n '/What went wrong/,/^\* Try/p' /tmp/build.log | head -45
            echo
            echo "########## 所有 FAILED 的任务 ##########"
            grep -n "FAILED" /tmp/build.log | head -25
            echo
            echo "########## 第一个 Caused by（最底层原因）##########"
            grep -n -A 6 "Caused by" /tmp/build.log | head -30
            echo
            echo "########## 日志末尾 40 行 ##########"
            tail -40 /tmp/build.log
          else
            echo "构建成功"
            tail -12 /tmp/build.log
          fi
          exit "$code"

      - name: Summarise the APK
        run: |
          set -euo pipefail
          APK=mobile/build/outputs/apk/debug/mobile-debug.apk
          ls -l "$APK"
          sha256sum "$APK"
          echo "--- 关键内容 ---"
          unzip -l "$APK" | grep -E "offline-mfi|libopus_microphone|lib/armeabi" | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: diplay-micfix-debug-apk
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: error
          retention-days: 30
